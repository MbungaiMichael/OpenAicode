# Netlify build config — app lives in web/ (Next.js).
# NOTE: no `publish` dir is set on purpose. Netlify's OpenNext adapter
# provisions its own server output; pinning publish to `.next` caused
# static-only deploys (pages built, 0 functions uploaded, site-wide 404).
# After pushing, set env vars in Site settings → Environment variables
# (NEVER commit real values):
#   DATABASE_URL (Supabase Postgres — required, SQLite cannot work on Netlify)
#   NEXTAUTH_SECRET, NEXT_PUBLIC_APP_URL, SUPABASE_URL,
#   SUPABASE_SERVICE_KEY, STORAGE_BUCKET
[build]
  base = "web"
  command = "npm run build"

# Cache Next.js build output between deploys
[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
